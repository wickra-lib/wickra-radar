# Wickra Radar — workspace.
# A liquidation-cascade early-warning radar built as one data-driven core
# (`wickra-radar-core`): a serde `RadarSpec` is folded over a perp universe (open
# interest, funding, order-book and liquidation events) with 514 O(1) streaming
# indicators, scored per signal, aggregated with weights into a `RadarAlert`, and
# scanned in parallel (rayon) or sequentially (the WASM fallback), byte-for-byte
# identical. The core is exposed as a JSON-over-C-ABI data API in ten languages,
# mirroring the Wickra tiering: Rust core -> native Python/Node/WASM + a C ABI
# hub for C/C++/C#/Go/Java/R.
#
# The `members` list grows as crates are added, phase by phase; the final set is:
#   crates/radar-core, crates/radar-cli, crates/radar-bench,
#   bindings/c, bindings/python, bindings/node, bindings/wasm
# (crates/radar-tui is added only if the optional reference TUI is built.)

[workspace]
resolver = "2"
members = ["crates/radar-core", "crates/radar-cli", "crates/radar-bench", "bindings/c", "bindings/python", "bindings/node", "bindings/wasm", "examples/rust"]
# The fuzz crate is its own (detached) workspace — cargo-fuzz builds it on a
# nightly toolchain with sanitizer flags.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.1"
edition = "2021"
rust-version = "1.86"
license = "MIT OR Apache-2.0"
authors = ["wickra-lib"]
repository = "https://github.com/wickra-lib/wickra-radar"
homepage = "https://wickra.org"
readme = "README.md"
keywords = ["trading", "liquidation", "perpetuals", "indicators", "finance"]
categories = ["finance", "command-line-utilities"]

[workspace.dependencies]
# Wickra ecosystem, every piece from crates.io. wickra-exchange supplies the
# live perp derivative feeds (open interest, funding, liquidations, order book)
# whose event shapes are the radar's `feed` inputs, behind the `live` feature.
#
# The exchange pin is exact, as the released siblings pin their engines: cargo
# treats "this git URL" and the registry as different sources, and a caret pin
# that lands on a newer patch than a sibling's leaves two copies of an engine in
# one graph -- and two copies do not share a Candle or an event type. Move it
# with the family. wickra-core and wickra-data follow their released 1.0 line.
# (wickra-backtest-core was declared here as a git dependency and used by no
# crate; it is gone rather than pinned.)
wickra-core = "1.0"
wickra-data = "1.0"
wickra-exchange = "=0.1.4"
# Workspace-internal crate, referenced by the CLI, bench and bindings.
wickra-radar-core = { version = "0.1.1", path = "crates/radar-core" }
# Serialization — the data-driven boundary (spec/command/alert as JSON).
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
# Exact decimal arithmetic where price/qty precision matters.
rust_decimal = { version = "1", features = ["serde"] }
thiserror = "2"
# Data-parallel scan across the perp universe.
rayon = "1"
clap = { version = "4", features = ["derive"] }
# C ABI header generation.
cbindgen = "0.27"
# Test/dev.
# codspeed-criterion-compat is a drop-in for criterion: the benches keep their
# criterion API and run as criterion locally, but under `cargo codspeed` they
# report measurements instead of merely executing. Without the alias the
# CodSpeed job runs the benchmarks and uploads nothing, which reads as a pass.
criterion = { package = "codspeed-criterion-compat", version = "5.0.1" }
proptest = "1"

[workspace.lints.rust]
# The core and all bindings are safe Rust; the C ABI hub re-allows unsafe
# locally (it must call across the FFI boundary).
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Allowed pedantic lints (same precedent as the wickra core).
cast_precision_loss = "allow"
cast_sign_loss = "allow"
cast_possible_truncation = "allow"
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
too_many_lines = "allow"
similar_names = "allow"

[profile.release]
# Panics must never unwind across the C ABI boundary: abort instead.
lto = true
codegen-units = 1
panic = "abort"
strip = true
