[package]
name = "wickra-radar"
description = "Reference command-line radar over the Wickra wickra-radar-core: load a spec and a perp event stream, scan for cascade signals, print the report as text or JSON."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true

# docs.rs builds with every feature on, so the whole surface is documented.
[package.metadata.docs.rs]
all-features = true
keywords.workspace = true
categories.workspace = true

[lints]
workspace = true

[[bin]]
name = "wickra-radar"
path = "src/main.rs"

[dependencies]
# The data-driven radar core.
wickra-radar-core.workspace = true
